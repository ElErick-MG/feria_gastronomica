<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registra tu equipo, gira la ruleta y descubre qué país cocinarán juntos en la Feria Gastronómica del Conjunto Carmencita.">
  <title>Conjunto Carmencita — Feria Gastronómica</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Estilos de la aplicación -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 2. HTML: pantallas (solo una visible a la vez) ===== -->
<main>

  <!-- Paso 1: Bienvenida -->
  <section id="s-intro" class="screen">
    <span class="float" style="left:8%;top:15%">🌮</span>
    <span class="float" style="right:10%;top:20%">🍝</span>
    <span class="float" style="left:14%;bottom:18%">🍣</span>
    <span class="float" style="right:12%;bottom:14%">🥘</span>
    <h1>Conjunto Carmencita</h1>
    <h2>Feria Gastronómica</h2>
    <p>Arma tu equipo, gira la ruleta y descubre qué país cocinarán juntos.</p>
    <button id="btnStart">Ingresar</button>
    <button class="link" id="linkAdmin">Administrador</button>
  </section>

  <!-- Paso 2: Identificación -->
  <section id="s-nombre" class="screen" hidden>
    <button class="btn-back" id="btnVolverInicio">← Volver</button>
    <form class="box" id="fNombre">
      <h2>¿Cómo te llamas?</h2>
      <p style="margin:.5rem 0 1rem">Si ya te registraste, retomarás donde lo dejaste.</p>
      <input id="inNombre" placeholder="Nombre completo" autocomplete="name" required>
      <button type="submit">Continuar</button>
    </form>
  </section>

  <!-- Paso 3: Experiencia en cocina -->
  <section id="s-cocina" class="screen" hidden>
    <button class="btn-back" id="btnVolverNombre">← Volver</button>
    <div class="box">
      <h2>¿Tiene experiencia en la cocina?</h2>
      <div class="row" style="margin-top:1.2rem">
        <button data-r="si">Sí</button>
        <button data-r="no">No</button>
      </div>
    </div>
  </section>

  <!-- Pasos 4 y 5: Grupo asignado + sala de espera -->
  <section id="s-grupo" class="screen" hidden>
    <div class="box">
      <p>Tu equipo es el</p>
      <div class="letra">Grupo <span id="gLetra"></span></div>
      <ul id="miembros"></ul>
      <div class="bar"><div id="barra"></div></div>
      <p id="progTxt"></p>
      <button id="btnRuleta" style="margin-top:1rem" disabled>Esperando a los demás…</button>
    </div>
  </section>

  <!-- Paso 6: Ruleta de países -->
  <section id="s-ruleta" class="screen" hidden>
    <button class="btn-back" id="btnVolverGrupo">← Volver al grupo</button>
    <h2>Ruleta de países</h2>
    <div id="ruedaBox">
      <div id="puntero"></div>
      <svg id="rueda" viewBox="0 0 400 400" aria-label="Ruleta de países"></svg>
    </div>
    <p id="msgRuleta" style="max-width:520px"></p>
    <button id="btnGirar">Girar para mi grupo</button>
    <button id="btnFicha" hidden>Ver ficha del país</button>
  </section>

  <!-- Paso 7: Ficha gastronómica del país -->
  <section id="s-ficha" class="screen" hidden>
    <button class="btn-back" id="btnVolverGrupoF">← Volver al grupo</button>
    <div id="ficha"></div>
  </section>

  <!-- Panel de Administración -->
  <section id="s-admin" class="screen" hidden>
    <div class="box">
      <h2>Panel de administración</h2>
      <p style="margin:.6rem 0" id="admResumen"></p>
      <div class="row">
        <input id="inCupo" type="number" min="1" style="width:130px;margin:0" aria-label="Cupo total de participantes">
        <button id="btnCupo">Guardar cupo</button>
      </div>
    </div>
    <div class="grid" id="admGrid" style="max-width:820px"></div>
    <div class="row">
      <button id="btnVolver">Volver</button>
      <button id="btnReset" style="background:#7a2a1a;color:#fff">Reiniciar evento</button>
    </div>
  </section>

</main>

<!-- Notificaciones tipo toast -->
<div id="toast" hidden></div>

<!-- ===== Librerías CDN ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<!-- ===== Módulo principal de la aplicación ===== -->
<script type="module" src="js/app.js"></script>

</body>
</html>
